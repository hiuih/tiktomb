<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(160deg, #16171b 0%, #050505 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-app-region: drag;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .mark {
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: #0a0a0b;
    box-shadow: 0 0 60px rgba(37, 244, 238, 0.18), 0 8px 30px rgba(0,0,0,0.5);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .mark svg { width: 44px; height: 44px; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .title {
    color: #f2f2f2;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }
  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 3px;
    border-radius: 50%;
    background: #FE2C55;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; background: #25F4EE; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-4px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="-30 -18 60 100" width="44" height="44" fill="none">
        <g transform="translate(-9 3) scale(0.5) translate(0 -8)">
          <ellipse cx="-16" cy="54" rx="26" ry="19" transform="rotate(-18 -16 54)" fill="#25F4EE"/>
          <rect x="-6.5" y="-70" width="13" height="128" rx="6.5" fill="#25F4EE"/>
          <path d="M6.5,-70 C34,-62 42,-38 30,-16 C40,-30 40,-52 22,-64 C17,-67 11,-69 6.5,-70 Z" fill="#25F4EE"/>
        </g>
        <g transform="translate(9 -3) scale(0.5) translate(0 -8)">
          <ellipse cx="-16" cy="54" rx="26" ry="19" transform="rotate(-18 -16 54)" fill="#FE2C55"/>
          <rect x="-6.5" y="-70" width="13" height="128" rx="6.5" fill="#FE2C55"/>
          <path d="M6.5,-70 C34,-62 42,-38 30,-16 C40,-30 40,-52 22,-64 C17,-67 11,-69 6.5,-70 Z" fill="#FE2C55"/>
        </g>
        <g transform="scale(0.5) translate(0 -8)">
          <ellipse cx="-16" cy="54" rx="26" ry="19" transform="rotate(-18 -16 54)" fill="#FFFFFF"/>
          <rect x="-6.5" y="-70" width="13" height="128" rx="6.5" fill="#FFFFFF"/>
          <path d="M6.5,-70 C34,-62 42,-38 30,-16 C40,-30 40,-52 22,-64 C17,-67 11,-69 6.5,-70 Z" fill="#FFFFFF"/>
        </g>
      </svg>
    </div>
    <div class="title">Loading TikTomb</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
